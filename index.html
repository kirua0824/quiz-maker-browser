<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="教材カードから10問小テストを作って採点できるブラウザ版クイズメーカー"
    />
    <title>クイズメーカー</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css?v=6" />
  </head>
  <body>
    <main class="appShell" aria-labelledby="appTitle">
      <section class="studioPanel" aria-label="問題作成">
        <div class="brandRow">
          <div>
            <p class="eyebrow">Study Arcade</p>
            <h1 id="appTitle">クイズメーカー</h1>
          </div>
          <div class="scoreBadge" aria-live="polite">
            <span>BEST</span>
            <strong id="bestScore">0</strong>
          </div>
        </div>

        <section class="deckPicker" aria-label="教材選択">
          <div class="deckPicker__header">
            <span>教材を選ぶ</span>
            <strong id="deckStatus">未選択</strong>
          </div>
          <div id="deckCards" class="deckCards"></div>
        </section>

        <textarea id="quizSource" class="sourceBuffer" spellcheck="false" aria-hidden="true" tabindex="-1"></textarea>

        <div class="settings">
          <label class="settings__wide">
            <span>小ジャンル</span>
            <select id="genreMode">
              <option value="__all__">すべて</option>
            </select>
          </label>
          <label>
            <span>出題順</span>
            <select id="orderMode">
              <option value="shuffle">シャッフル</option>
              <option value="inOrder">入力順</option>
            </select>
          </label>
          <label>
            <span>制限時間</span>
            <select id="timeMode">
              <option value="0">なし</option>
              <option value="15">15秒</option>
              <option value="30">30秒</option>
              <option value="60">60秒</option>
            </select>
          </label>
        </div>

        <div class="actionRow">
          <button id="startButton" class="primaryButton" type="button">スタート</button>
        </div>
      </section>

      <section class="playPanel" aria-label="小テスト">
        <div class="quizTopbar">
          <div class="progressText">
            <span id="roundText">準備中</span>
            <strong id="questionCount">0問</strong>
          </div>
          <div class="statCluster">
            <span><b id="scoreText">0</b>点</span>
            <span><b id="streakText">0</b>連続</span>
          </div>
        </div>

        <div class="progressTrack" aria-hidden="true">
          <span id="progressFill"></span>
        </div>

        <article id="quizCard" class="quizCard">
          <p class="cardLabel">Question</p>
          <h2 id="questionText">教材カードと小ジャンルを選んでスタートしてください。</h2>

          <div id="choiceGrid" class="choiceGrid" aria-label="選択肢"></div>

          <form id="answerForm" class="answerForm">
            <label class="fieldLabel" for="answerInput">直接入力</label>
            <input id="answerInput" type="text" autocomplete="off" disabled />
            <div class="answerButtons">
              <button id="hintButton" class="ghostButton" type="button" disabled>ヒント</button>
              <button id="checkButton" class="primaryButton" type="submit" disabled>答え合わせ</button>
            </div>
          </form>

          <div id="feedback" class="feedback" aria-live="polite"></div>
        </article>

        <div class="controlDock">
          <button id="restartButton" class="ghostButton" type="button" disabled>最初から</button>
          <button id="nextButton" class="primaryButton" type="button" disabled>次の問題</button>
        </div>

        <section id="resultPanel" class="resultPanel" aria-live="polite" hidden>
          <div>
            <p class="cardLabel">Result</p>
            <h2 id="resultTitle">おつかれさま！</h2>
          </div>
          <div class="resultStats">
            <span><b id="finalScore">0</b>点</span>
            <span><b id="finalAccuracy">0</b>%</span>
            <span><b id="finalCorrect">0</b>/<b id="finalTotal">0</b>問</span>
          </div>
          <div id="reviewList" class="reviewList"></div>
        </section>
      </section>
    </main>

    <script defer src="./config.js?v=2"></script>
    <script defer src="./src/game.js?v=9"></script>
  </body>
</html>
